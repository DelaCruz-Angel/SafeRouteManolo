<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>SafeRouteManolo Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="container">
    <a href="#" class="logo">
      <img src="/ICONS/purp.png" class="logo-icon">
      <span style="color: rgb(223, 65, 223); font-weight: 900;">Safe</span>RouteManolo
    </a>
    <nav>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="#">Dashboard</a>
        <a href="map.html">Checkmap</a>
        <a href="updates.html">Updates</a>
        <a href="about.html">About</a>
        <a href="contacts.html">Contact</a>
      </div>
      <button class="mobile-menu-button" id="mobileBtn">☰</button>
    </nav>
    <div class="profile dropdown">
      <img src="https://i.pinimg.com/736x/36/9a/2d/369a2d86c511f24fe51ced8f29d6ae6e.jpg">
      <span class="dropdown-arrow">▼</span>
      <div class="dropdown-menu">
        <div class="dropdown-item" id="displayUsername">Full Name</div>
        <div class="dropdown-item logout">Logout</div>
      </div>
    </div>
  </div>
</header>

<div class="main-layout">
  <!-- LEFT SIDE -->
  <div class="left-side">
    <div class="overview-header">Overview</div>

    <!-- CRUD: Add Hazard Form -->
    <form id="addHazardForm" style="margin-bottom:10px;">
      <input type="text" id="hazardTitle" placeholder="Title" required>
      <input type="text" id="hazardDesc" placeholder="Description" required>
      <select id="hazardSeverity" required>
        <option value="">Severity</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
      <button type="submit">Add Hazard</button>
    </form>

    <div class="scroll-wrapper" id="cardContainer"></div>
  </div>

  <!-- Image Popup -->
  <div id="imagePopup">
    <img src="" id="popupImg" alt="Full Image">
  </div>

  <!-- RIGHT SIDE -->
  <div class="right-side">
    <div class="weather-box" id="weatherBox">
      <div class="overview-header">Weather</div>
      <div class="weather-content">
        <p class="placeholder-text">Loading Weather...</p>
      </div>
    </div>

    <div class="chart-box">
      <div class="chart-description">Hazard severity distribution</div>
      <canvas id="severityChart"></canvas>
    </div>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
