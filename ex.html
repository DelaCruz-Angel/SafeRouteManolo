<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chart & Weather Layout</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #eef2f6;
        padding: 20px;
    }

    /* Chart Section Wrapper */
    .chart-section {
        width: 100%;
        padding: 20px;
    }

    /* Title */
    .chart-title {
        margin-bottom: 15px;
        font-size: 24px;
        font-weight: 700;
        color: #333;
        padding-left: 5px;
    }

    /* Flex wrapper for chart + weather */
    .chart-layout {
        display: flex;
        gap: 20px;
        width: 100%;
    }

    /* Big chart container */
    .big-chart-box {
        flex: 1;
        height: 400px; /* Adjust chart height */
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        padding: 20px;
        position: relative;
    }

    /* Weather side container */
    .weather-box {
        width: 260px; /* Small width */
        height: 400px; /* Same height as chart */
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        padding: 20px;
    }

    /* Placeholder text */
    .placeholder-text {
        font-size: 14px;
        color: #777;
        text-align: center;
        margin-top: 40%;
    }
</style>
</head>

<body>

    <!-- SECTION -->
    <div class="chart-section">

        <!-- Title -->
        <h2 class="chart-title">Recent Chart</h2>

        <!-- Chart + Weather Layout -->
        <div class="chart-layout">

            <!-- Big chart container -->
            <div class="big-chart-box">
                <!-- Insert your bar chart here -->
                <p class="placeholder-text">📊 Bar Chart Goes Here</p>
            </div>

            <!-- Weather container -->
            <div class="weather-box">
                <!-- Insert your weather info here -->
                <p class="placeholder-text">☀️ Live Weather</p>
            </div>

        </div>

    </div>

</body>
</html>
