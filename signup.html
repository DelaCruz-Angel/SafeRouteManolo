<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    .container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* LEFT PANEL (desktop only) */
    .left {
      flex: 1;
      background: url("https://i.pinimg.com/1200x/47/e5/c7/47e5c7edb718f42d3b8240b3d12725dc.jpg");
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .logo-icon {
      width: 130px;
      height: 130px;
    }

    .logo-text {
      font-size: 2.8rem;
      font-weight: 700;
    }

    /* RIGHT PANEL */
    .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 50px 40px 20px 40px;
      background: #ffffff;
      overflow: auto;
      position: relative;
    }

    .welcome-text {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 10px;
      margin-top: 50px;
    }

    .sub-text {
      font-size: 1rem;
      color: #555;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    .input-row {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    .input-group.small {
      flex: 1;
    }

    .input-group.tiny {
      width: 80px;
    }

    button.signup-btn {
      width: 100%;
      padding: 12px;
      background: #734f96;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }

    button.signup-btn:hover {
      background: #5e3a85;
    }

    .signin-text {
      text-align: center;
      margin-top: 15px;
      font-size: 0.95rem;
      color: #555;
    }

    .signin-text a {
      color: #734f96;
      text-decoration: none;
      font-weight: 600;
    }

    .signin-text a:hover {
      text-decoration: underline;
    }

    /* TOGGLE PASSWORD ICON */
    .password-group {
      position: relative;
    }
    .password-group span.toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
    }

    .mobile-logo {
  display: none; /* hidden on desktop */
}

    /* MOBILE RESPONSIVE */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        height: auto;
      }

      .left {
        display: none;
      }

      .right {
        width: 100%;
        padding: 20px;
        justify-content: flex-start;
      }

      /* MOBILE LOGO ABOVE FORM */
      .mobile-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 25px;
      }

      .mobile-logo img {
        width: 40px;
        height: 40px;
      }

      .mobile-logo span {
        font-size: 1.4rem;
        font-weight: 500;
      }

      /* Shrink headings */
      .welcome-text {
        font-size: 1.5rem;
        margin-top: 10px;
        text-align: center;
      }

      .sub-text {
        font-size: 0.9rem;
        text-align: center;
      }

      .input-group label {
        font-size: 0.85rem;
      }

      input {
        font-size: 0.9rem;
      }

      .input-row {
        flex-direction: column;
        gap: 10px;
      }

      .input-group.small,
      .input-group.tiny {
        width: 100%;
      }

      button.signup-btn {
        font-size: 0.95rem;
        padding: 10px;
      }

      .signin-text {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- LEFT PANEL (desktop only) -->
  <div class="left">
    <div class="logo-wrapper">
      <img src="/ICONS/purp.png" class="logo-icon">
      <span class="logo-text"><span style="color: #734f96; font-weight: 900;">Safe</span>RouteManolo</span>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <!-- MOBILE LOGO -->
    <div class="mobile-logo">
      <img src="/ICONS/purp.png">
      <span><span style="color:#734f96; font-weight:900;">Safe</span>RouteManolo</span>
    </div>

    <h1 class="welcome-text">Create Account</h1>
    <p class="sub-text">Fill in the information below</p>

    <!-- FIRST NAME | LAST NAME | MI -->
    <div class="input-row">
      <div class="input-group small">
        <label>First Name</label>
        <input type="text">
      </div>

      <div class="input-group small">
        <label>Last Name</label>
        <input type="text">
      </div>

      <div class="input-group tiny">
        <label>MI</label>
        <input type="text" maxlength="1">
      </div>
    </div>

    <!-- EMAIL -->
    <div class="input-group">
      <label>Email</label>
      <input type="email">
    </div>

    <!-- PASSWORD -->
    <div class="input-group password-group">
      <label>Password</label>
      <input type="password" id="password">
      <span class="toggle-password">👁️</span>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div class="input-group password-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword">
      <span class="toggle-password">👁️</span>
    </div>

    <!-- Success / Error Message -->
    <p id="signupMessage" style="text-align:center; color:green; font-weight:600; margin-top:10px;"></p>

    <!-- SIGN UP BUTTON -->
    <button class="signup-btn">Sign Up</button>

    <!-- SIGN IN LINK -->
    <p class="signin-text">
      Already have an account?
      <a href="index.html">Sign in</a>
    </p>
  </div>
</div>

<script>
  // Toggle password visibility
  document.querySelectorAll('.toggle-password').forEach((eye) => {
    eye.addEventListener('click', () => {
      const pwdInput = eye.previousElementSibling;
      pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
    });
  });

  class User {
    #firstName; #lastName; #mi; #email; #password;
    constructor(firstName,lastName,mi,email,password){
      this.#firstName=firstName; this.#lastName=lastName;
      this.#mi=mi; this.#email=email; this.#password=password;
    }
    getEmail(){ return this.#email; }
    checkPassword(password){ return this.#password===password; }
    toJSON(){ return {firstName:this.#firstName,lastName:this.#lastName,mi:this.#mi,email:this.#email,password:this.#password}; }
    saveToStorage(){ localStorage.setItem('user', JSON.stringify(this.toJSON())); }
  }

  const signupBtn = document.querySelector('.signup-btn');
  const signupMessage = document.getElementById('signupMessage');

  // Only allow letters for name inputs
  document.querySelectorAll('input[type="text"]').forEach((input,index)=>{
    if(index<=2){
      input.addEventListener('input',()=>{ input.value=input.value.replace(/[^a-zA-Z]/g,''); });
    }
  });

  // SIGNUP button click
  signupBtn.addEventListener('click',()=>{
    const inputsText=document.querySelectorAll('input[type="text"]');
    const firstName=inputsText[0].value.trim();
    const lastName=inputsText[1].value.trim();
    const mi=inputsText[2].value.trim();
    const email=document.querySelector('input[type="email"]').value.trim();
    const password=document.getElementById('password').value.trim();
    const confirmPassword=document.getElementById('confirmPassword').value.trim();

    if(!firstName||!lastName||!email||!password||!confirmPassword){
      signupMessage.style.color='red';
      signupMessage.textContent='Please fill in all fields';
      return;
    }

    if(!email.endsWith('@gmail.com')){
      signupMessage.style.color='red';
      signupMessage.textContent='Please use a valid Gmail account';
      return;
    }

    if(password!==confirmPassword){
      signupMessage.style.color='red';
      signupMessage.textContent='Passwords do not match';
      return;
    }

    const passwordRegex=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
    if(!passwordRegex.test(password)){
      signupMessage.style.color='red';
      signupMessage.textContent='Password must be at least 8 characters long and include uppercase, lowercase, number, and special character';
      return;
    }

    const newUser=new User(firstName,lastName,mi,email,password);
    newUser.saveToStorage();

    signupMessage.style.color='green';
    signupMessage.textContent='Sign up successful! Redirecting to login...';

    setTimeout(()=>{ window.location.href='index.html'; },2000);
  });
</script>

</body>
</html>
