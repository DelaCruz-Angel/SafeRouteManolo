<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="signup.css">
</head>
<body>

<div class="container">
  
  <div class="left">
    <div class="overlay"></div> 
    
    <img src="/ICONS/LOGS.png" alt="Logo" class="logo">

    <div class="slider">
      <img src="https://i.pinimg.com/736x/31/31/6a/31316af172d5c1078ed778a00c51a29c.jpg" alt="Scenic view of Manolo Fortich mountains and greenery." class="slide active">
      <img src="https://i.pinimg.com/736x/df/77/7c/df777cf2f0efc93c55508345c90e469e.jpg" alt="A river flowing through a lush green valley." class="slide">
      <img src="https://i.pinimg.com/736x/fe/11/a9/fe11a99c932781b5326aaaa8771796e0.jpg" alt="Beautiful landscape of Manolo Fortich with clear sky." class="slide">
    </div>
  </div>

  <div class="right">
    <div class="form-wrapper">
      <h1 class="welcome-text">Create Account</h1>
      <p class="sub-text">Join us to explore the beauty and safety of our area.</p>

      <div class="input-row">
        <div class="input-group small">
          <label for="first-name">First Name</label>
          <i class="fa-regular fa-user"></i>
          <input type="text" id="first-name" placeholder="ex. Juan">
          <div class="error-message" id="first-name-error"></div>
        </div>

        <div class="input-group small">
          <label for="last-name">Last Name</label>
          <i class="fa-regular fa-user"></i>
          <input type="text" id="last-name" placeholder="ex. Dela Cruz">
          <div class="error-message" id="last-name-error"></div>
        </div>

        <div class="input-group tiny">
          <label for="mi">MI</label>
          <input type="text" id="mi" maxlength="1" placeholder="M">
        </div>
      </div>

      <div class="input-group">
        <label for="username">Username</label>
        <i class="fa-solid fa-at"></i>
        <input type="text" id="username" placeholder="Choose a username">
        <div class="error-message" id="username-error"></div>
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="email" placeholder="name@example.com">
        <div class="error-message" id="email-error"></div>
      </div>

      <div class="input-group" id="password-group">
        <label for="password">Password</label>
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" placeholder="••••••••">
        <i class="fa-solid fa-check validation-icon check"></i>
        <i class="fa-solid fa-xmark validation-icon times"></i>
        <i class="fa-regular fa-eye-slash password-toggle" data-target="password"></i>
        <div class="error-message" id="password-error"></div>
      </div>

      <div class="input-group" id="confirm-password-group">
        <label for="confirm-password">Confirm Password</label>
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="confirm-password" placeholder="••••••••">
        <i class="fa-solid fa-check validation-icon check"></i>
        <i class="fa-solid fa-xmark validation-icon times"></i>
        <i class="fa-regular fa-eye-slash password-toggle" data-target="confirm-password"></i>
        <div class="error-message" id="confirm-password-error"></div>
      </div>

      <button class="signup-btn">Sign Up</button>

      <p class="signin-text">
        Already have an account?
        <a href="index.html">Sign in</a>
      </p>
    </div>
  </div>
</div>

<script src="signup.js"></script>

</body>
</html>
