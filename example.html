        transform: rotate(180deg);
    }

    /* Dropdown menu */
    .dropdown-content {
        position: absolute;
        right: 0;
        top: 50px;
        min-width: 160px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        opacity: 0;
        transform: translateY(-5px);
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
    }

    /* When active */
    .dropdown-content.active {
        opacity: 1;
        transform: translateY(0px);
        pointer-events: auto;
    }

    .dropdown-content a {
        display: block;
        padding: 10px;
        color: black;
        text-decoration: none;
        font-size: 14px;
    }

    .dropdown-content a:hover {
        background: #f5f5f5;
    }
</style>
</head>
<body>

<div class="dropdown">
    <div class="dropdown-btn" onclick="toggleDropdown()">
        <div class="profile-pic">👤</div>
        <span class="arrow" id="arrow">▼</span>
    </div>

    <div class="dropdown-content" id="dropdownMenu">
        <a href="#">Your Name</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>
    </div>
</div>

<script>
function toggleDropdown() {
    const menu = document.getElementById("dropdownMenu");
    const arrow = document.getElementById("arrow");

    menu.classList.toggle("active");
    arrow.classList.toggle("rotate");
}

// Close dropdown when clicking outside
window.addEventListener("click", function(e) {
    const menu = document.getElementById("dropdownMenu");
    const btn = document.querySelector(".dropdown-btn");
    const arrow = document.getElementById("arrow");

    if (!btn.contains(e.target)) {
        menu.classList.remove("active");
        arrow.classList.remove("rotate");
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chart & Weather Layout</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #eef2f6;
        padding: 20px;
    }

    /* Chart Section Wrapper */
    .chart-section {
        width: 100%;
        padding: 20px;
    }

    /* Title */
    .chart-title {
        margin-bottom: 15px;
        font-size: 24px;
        font-weight: 700;
        color: #333;
        padding-left: 5px;
    }

    /* Flex wrapper for chart + weather */
    .chart-layout {
        display: flex;
        gap: 20px;
        width: 100%;
    }

    /* Big chart container */
    .big-chart-box {
        flex: 1;
        height: 400px; /* Adjust chart height */
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        padding: 20px;
        position: relative;
    }

    /* Weather side container */
    .weather-box {
        width: 260px; /* Small width */
        height: 400px; /* Same height as chart */
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        padding: 20px;
    }

    /* Placeholder text */
    .placeholder-text {
        font-size: 14px;
        color: #777;
        text-align: center;
        margin-top: 40%;
    }
</style>
</head>

<body>

    <!-- SECTION -->

            </div>

        </div>

    </div>

</body>
</html>
