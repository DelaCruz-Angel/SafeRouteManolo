<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
  height: 100%;
  margin: 0;
  overflow: hidden; /* prevents scroll on desktop */
}

.container {
  display: flex;
  height: 100vh; /* full viewport height */
  width: 100vw; /* full viewport width */
}

.left {
  flex: 1;
  position: relative;
  overflow: hidden;
}

/* Fixed logo on top-left */
.left .logo {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 150px;
  z-index: 10; /* makes sure it stays above the slider */
}

/* Slider Styles */
.slider {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1s ease-in-out;
}

.slide.active {
  opacity: 1;
}



.right {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 50px 40px;
  background: #ffffff;
  overflow: auto; /* allows scrolling if content is taller than viewport on smaller screens */
}


    .welcome-text {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .sub-text {
      font-size: 1rem;
      color: #555;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      margin-top: 5px;
      border: 1px solid rgb(119, 197, 67)740;
      border-radius: 5px;
      font-size: 1rem;
    }

    .forgot-password {
      font-size: 0.9rem;
      color: #167740;
      text-align: right;
      margin-bottom: 20px;
      cursor: pointer;
    }

   .login-btn {
      width: 100%;
      padding: 12px;
      background: #167740;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .social-login {
  display: flex;
  justify-content: center; /* center the icons */
  gap: 20px; /* distance between icons */
  margin-bottom: 20px;
}


    .social-login img {
      width: 45px;
      cursor: pointer;
    }

    .signup-text {
      text-align: center;
      font-size: 0.95rem;
      color: #555;
    }

    .signup-text a {
      color: #167740;
      text-decoration: none;
      font-weight: 600;
      margin-left: 5px;
    }

      @media (max-width: 900px) {
  /* Shrink texts for mobile screens */
  .welcome-text {
    font-size: 1.5rem; /* smaller than desktop */
  }

  .sub-text {
    font-size: 0.9rem;
  }

  .input-group label {
    font-size: 0.85rem;
  }

  input {
    font-size: 0.9rem;
  }

  .forgot-password {
    font-size: 0.8rem;
  }

 .login-btn {
    font-size: 0.9rem;
  }

  .signup-text {
    font-size: 0.8rem;
  }

  .container {
    flex-direction: column;
  }

  /* Hide the left side completely on mobile */
  .left {
    display: none;
  }

  /* Right side takes full width and height */
  .right {
    width: 100%;
    height: auto; /* let it grow with content */
    padding: 5px 20px;
    justify-content: flex-start;
  }

  /* Place the logo inside the right side on mobile */
  .right::before {
    content: "";
    display: block;
    background: url('/ICONS/newlog.png') no-repeat center;
    background-size: contain;
    width: 250px;   /* increase from 120px */
    height: 200px;  /* increase from 120px */
    margin: 0 auto 30px auto; /* keep centered and spacing below */
  }
}


  </style>
</head>
<body>

  <div class="container">
    <!-- Left Side -->
    <!-- Left Side -->
<div class="left">
  <img src="/ICONS/newlog.png" alt="Logo" class="logo">

  <div class="slider">
    <img src="https://i.pinimg.com/736x/31/31/6a/31316af172d5c1078ed778a00c51a29c.jpg" class="slide active">
    <img src="https://i.pinimg.com/736x/df/77/7c/df777cf2f0efc93c55508345c90e469e.jpg" class="slide">
    <img src="https://i.pinimg.com/736x/fe/11/a9/fe11a99c932781b5326aaaa8771796e0.jpg" class="slide">
  </div>
</div>


    <!-- Right Side -->
    <div class="right">
      <div class="welcome-text">Welcome!</div>
      <div class="sub-text">Sign in to continue to your account</div>

      <div class="input-group">
        <label for="username">Username / Email</label>
        <input type="text" id="username" placeholder="Enter your username or email">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
      </div>

      <div class="forgot-password">Forgot password?</div>
      
<button class="login-btn" onclick="location.href='dashboard.html'">Login</button>


      <div class="sub-text" style="text-align:center;">Or continue with</div>
      <div class="social-login">
        <img src="https://i.pinimg.com/1200x/5b/b0/f7/5bb0f73a7b3e0f976acad614a42e5040.jpg" alt="Facebook">
        <img src="https://i.pinimg.com/1200x/60/41/99/604199df880fb029291ddd7c382e828b.jpg" alt="Google">
        <img src="https://i.pinimg.com/736x/19/42/d5/1942d5deb0f788e6228054cd92767ff6.jpg" alt="Instagram">
      </div>

      <div class="signup-text">
        Don't have an account yet? <a href="/signup.html">Sign Up</a>
      </div>
    </div>
  </div>

<script>
  const slides = document.querySelectorAll('.slide');
  let current = 0;

  function nextSlide() {
    slides[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
  }

  setInterval(nextSlide, 3000); // automatically changes images
</script>


</body>
</html>
