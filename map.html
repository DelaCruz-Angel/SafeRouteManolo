<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Map - Manolo Fortich</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
          
    <link rel="stylesheet" href="map.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <button class="hamburger" id="hamburgerBtn">☰</button>

            <div class="logo">
                <img src="/ICONS/LOGS.png" alt="Logo">
            </div>

            <div class="mobile-nav" id="mobileNav">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="#">About</a>
                <a href="#">Check Map</a>
                <a href="#">Updates</a>
                <a href="#">Contacts</a>
            </div>

            <nav>
                <a href="index.html" data-page="index.html">
                    <img src="/ICONS/HOME.svg" class="nav-icon"> Home
                </a>
                <a href="dashboard.html" data-page="dashboard">
                    <img src="/ICONS/DASHBOARD.svg" class="nav-icon"> Dashboard
                </a>
                <a href="about.html" data-page="about">
                    <img src="/ICONS/ABOUT.svg" class="nav-icon"> About
                </a>
                <a href="map.html" data-page="checkmap" class="active">
                    <img src="/ICONS/CHECK.svg" class="nav-icon"> Check Map
                </a>
                <a href="updates.html" data-page="updates">
                    <img src="/ICONS/UPDATES.svg" class="nav-icon"> Updates
                </a>
                <a href="contacts.html" data-page="contacts">
                    <img src="/ICONS/CONTACTS.svg" class="nav-icon"> Contacts
                </a>
            </nav>
        </div>

        <div class="main">
            <div class="top-bar-wrapper">
                <div class="top-bar">
                    <div class="welcome-text">Welcome, User!</div>
                    <div class="search-container">
                        <input type="text" placeholder="Search here...">
                    </div>
                    <div class="profile dropdown">
                        <img src="https://i.pinimg.com/736x/53/84/a6/5384a6e9cf74a52248aa9714951f04d1.jpg" alt="Profile">
                        <span class="dropdown-arrow">▼</span>

                        <div class="dropdown-menu">
                            <div class="dropdown-item">User Name</div>
                            <div class="dropdown-item logout">Logout</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="map-info-container">
                <div id="map"></div>
                <div class="info-box">
                    <h2>Location Info</h2>
                    <p>Click a marker on the map to see details here.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
            
    <script src="map.js"></script>
</body>
</html>
